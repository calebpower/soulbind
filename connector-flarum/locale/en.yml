soulbind-flarum:
  admin:
    settings:
      title: soulbind
      core_url_label: Core URL
      core_url_help: >-
        Where the soulbind core answers. Leave empty to switch this connector
        off entirely -- the gates below become inert rather than closed.
      credential_label: Connector credential
      credential_help: >-
        Shown once when the connector was registered. Entering a new value
        replaces the old one; the current value is never sent back to this page.
      webhook_secret_label: Webhook secret
      webhook_secret_help: >-
        The shared secret core signs its webhooks with. Without it the webhook
        endpoint accepts nothing.
      fail_mode_label: When core is unreachable
      fail_mode_closed: Deny (recommended)
      fail_mode_open: Allow
      fail_mode_help: >-
        Applies only when core cannot be reached AND no recent decision is
        cached. A refusal from core is always a refusal, whatever this says.
      register_gate_label: Gate name for registration
      register_gate_help: >-
        Leave empty to not gate registration.
      post_gate_label: Gate name for posting
      post_gate_help: >-
        Leave empty to not gate posting.
      timeout_label: Decide timeout (ms)
      timeout_help: >-
        How long to wait for core before falling back. Kept short because this
        runs while somebody is waiting for a page. Values outside 100-10000 are
        clamped; anything unreadable falls back to 2000.
  forum:
    link:
      title: Linked accounts
      linked: >-
        This account is linked to {count} other.
      not_linked: >-
        This account is not linked to anything yet.
      get_code: Get a link code
      code_placeholder: Paste a code from the other platform
      redeem: Link
      unavailable: >-
        We cannot check your linked accounts right now. This is a problem on our
        side, not yours -- please try again shortly.
# Flarum looks up core.lib.error.<type> to decide what a person is shown, so
# these live under core rather than under this extension's own namespace.
core:
  lib:
    error:
      soulbind_gate_refused: >-
        This action needs a linked account. Link one and try again.
      soulbind_unavailable: >-
        This check is temporarily unavailable, so access is on hold. This is a
        problem on our side, not yours -- please try again shortly.
