# Cut a release when a version tag is pushed.
#
# WHY THIS EXISTS. docs/install.md tells an operator to "take the core
# distribution archive" and, until this, never said where from. The build
# produced the archives and they had no destination. This gives them one.
#
# WHAT SHIPS, and why it is these four:
#
#   core-<v>.tar.gz               bin/ + lib/, one jar per dependency
#   connector-discord-<v>.tar.gz  the same shape, the same reason
#   connector-velocity-<v>.jar    one shaded jar, dropped into plugins/
#   connector-plan-<v>.jar        one shaded jar, dropped into extensions/
#
# The two distributions are NOT fat jars, and departure 11 records why: §16
# forbids an LGPL artifact inside a shaded one, and in this layout that holds
# by construction rather than by an exclusion list somebody has to maintain
# correctly. The two plugin jars are shaded because a host loads one file out
# of a directory and there is no lib/ to unbundle into.
#
# connector-flarum ships no artifact on purpose: it is a Composer package
# installed from this repository's VCS tag, which is why its composer.json
# deliberately carries no `version` field.
#
# THE BUILD IS RE-RUN HERE rather than trusting whatever produced the tag. An
# artifact attached to a release is the thing people actually run, and "it built
# on somebody's laptop" is not a claim this repository makes anywhere else.
name: release

on:
  push:
    tags: ['v*']

permissions:
  # The only write this workflow needs, and it needs it to create the release.
  contents: write

jobs:
  release:
    name: build and publish the artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # FULL history and tags, because the version is derived from `git
          # describe` rather than written down (see SoulbindVersion). The
          # default shallow fetch brings no tags, every artifact would be named
          # 0.0.0-unversioned, and PluginJarGuardTest would fail the run --
          # loudly, which is the intended failure, but the fix is here.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # gradle/actions v6.3.0

      # The full check, not just assemble. A tag that cannot pass the suite is
      # a tag nobody should be able to download an artifact from.
      - name: build, test and guards
        run: ./gradlew --no-daemon build guards

      # The tag IS the version now -- SoulbindVersion derives it from `git
      # describe` -- so this can no longer catch somebody forgetting to bump a
      # literal. It is kept because what it checks changed rather than went
      # away: the derivation is code, code is wrong sometimes, and the failure
      # mode is an artifact on a release page carrying a name that is not the
      # release's. A published artifact is not something you quietly rename.
      #
      # It now fails for exactly two reasons, and both are worth stopping for:
      # the checkout had no tags (a shallow fetch -- see fetch-depth above), or
      # the derivation refused the tag and fell back to 0.0.0-unversioned, which
      # happens when a tag is not release-shaped. `v1.0` would do it.
      - name: the tag and the built version must agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ ! -f "core/build/distributions/core-${tag}.tar.gz" ]; then
            echo "tag ${GITHUB_REF_NAME} expects core-${tag}.tar.gz, which was not built." >&2
            echo "What is in core/build/distributions:" >&2
            ls -1 core/build/distributions >&2
            echo >&2
            echo "The version is derived from the tag by build-logic/src/main/kotlin/SoulbindVersion.kt." >&2
            echo "A name of 0.0.0-unversioned means it saw no v[0-9]* tag, or refused this one" >&2
            echo "as not release-shaped: it wants three numeric components, as in v1.2.3." >&2
            exit 1
          fi

      # Named exactly, not globbed. A glob is right only while there is exactly
      # one candidate, and the version now moves with every commit: `build/libs`
      # is never cleaned, so any tree that had been built before would offer
      # `cp` two jars and the release would carry both -- one of them stale, and
      # the wrong one indistinguishable from the right one on a download page.
      # A fresh runner has no earlier build, which is precisely why a glob here
      # would keep working until the day something reused a workspace.
      - name: gather the artifacts
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp "core/build/distributions/core-${v}.tar.gz" release/
          cp "connector-discord/build/distributions/connector-discord-${v}.tar.gz" release/
          cp "connector-velocity/build/libs/connector-velocity-${v}.jar" release/
          cp "connector-plan/build/libs/connector-plan-${v}.jar" release/
          # Checksums, because an operator downloading a jar over the internet
          # has no other way to know they got the bytes this build produced.
          ( cd release && sha256sum ./* > SHA256SUMS )
          cat release/SHA256SUMS

      # `gh`, not a third-party action, and that is the point rather than a
      # preference. This is the one step holding `contents: write`, so it is the
      # one step where somebody else's code running here would be able to do the
      # most -- and every other pin in this repository is a digest or a checksum
      # for exactly that reason: container images by SHA-256, Paper and Velocity
      # by SHA-256 in pins.env, the PHP PHAR by checksum. A floating action tag
      # in the middle of that is a mutable third-party dependency in the most
      # privileged place in the build.
      #
      # gh is preinstalled on GitHub-hosted runners and authenticates with the
      # job's own GITHUB_TOKEN, so removing the dependency costs nothing. The
      # remaining actions are pinned by commit SHA above; this one is simply not
      # a dependency any more.
      #
      # PUBLISHED, not drafted, at the owner's instruction: pushing a version
      # tag is the decision to release, and a draft made it two decisions with
      # the second easy to forget.
      #
      # What that gives up, stated rather than glossed: a mistaken tag becomes a
      # download immediately. What stands in its place is everything above --
      # the full suite and the guards run BEFORE this step, and the version
      # check refuses a tag the build did not produce artifacts for. A bad tag
      # now fails the run instead of reaching a draft nobody reads. What is left
      # uncovered is a tag that is genuinely wrong about WHICH commit should
      # ship, and no automated check was ever going to have an opinion on that.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            release/*
