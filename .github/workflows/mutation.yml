# The mutation ratchet, on its own schedule.
#
# NOT on every push, and the reason is arithmetic rather than taste: a full
# sweep of `core` alone is roughly twenty minutes, and the tree is nine modules.
# A guard that adds half an hour to every push is a guard somebody turns off.
#
# It already runs in every reaper session, which is the pre-push loop and the
# gate that matters. This is a second place it runs, so that a long gap between
# sessions does not mean a long gap between sweeps.
#
# WHAT IT ASSERTS is a ratchet, never a threshold: mutation-baseline.txt holds
# one row per module and this fails a module whose SURVIVED or NO_COVERAGE count
# has gone UP. Nobody has to defend a number and nobody can drift past one. Read
# that file's header before touching a row.
name: mutation ratchet

on:
  schedule:
    # Weekly. Frequent enough that a regression is found while the change is
    # still recent, rare enough that it is never the reason a push waits.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two sweeps at once. PIT's coverage minion does not survive being run
  # in parallel with itself -- the workstation build serialises them through a
  # Gradle BuildService for exactly this reason, and two runners would put the
  # same race back by another route.
  group: mutation
  cancel-in-progress: false

jobs:
  ratchet:
    name: every module against its baseline
    runs-on: ubuntu-latest
    # A full sweep is long. The default six-hour cap would let a wedged run sit
    # there all morning; this fails it while somebody is still looking.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # FULL history and tags, because the version is derived from `git
          # describe` rather than written down (see SoulbindVersion). The
          # default shallow fetch brings no tags, every artifact would be named
          # 0.0.0-unversioned, and PluginJarGuardTest would fail the run --
          # loudly, which is the intended failure, but the fix is here.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # gradle/actions v6.3.0

      # --continue, and it is load-bearing. Gradle fails fast across modules, so
      # without it a regression in the first module alphabetically hides the
      # state of the other eight -- and a guard that reports one module per run
      # takes nine runs to tell you where you stand.
      - name: mutationRatchet
        run: ./gradlew --no-daemon --continue mutationRatchet

      # ALWAYS, not on failure. A passing sweep's reports are what the next
      # person diffs when a row moves, and DECISIONS 10.46 is the entry that
      # exists because counts alone could not say WHAT had changed.
      - name: pitest reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pitest-reports
          path: '**/build/reports/pitest/'
          retention-days: 30
