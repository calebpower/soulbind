# Third-party licence rules for the inventory generator.
#
# Copyright (c) 2026 Caleb L. Power. Apache-2.0; see LICENSE.
#
# Read by build-logic/src/main/kotlin/soulbind.licence-inventory.gradle.kts.
# Sections are [name], entries are key = value, # starts a comment.
#
# The generator reads each artifact's licence from its OWN POM, walking the
# parent chain. This file exists for the three things a POM cannot settle:
#
#   [aliases]        POM licence names are free text and wildly inconsistent.
#                    This maps the raw string to a canonical id. An unmapped
#                    name FAILS THE BUILD -- specification §16.
#   [allowed]        The canonical ids this project accepts, each with the
#                    reason it is acceptable. A new one fails until added.
#   [overrides]      Artifacts whose POM chain names no licence. Each needs a
#                    comment saying where the licence was established.
#   [never-bundled]  Artifacts that must never end up inside a shaded jar.

# ---------------------------------------------------------------------------
[allowed]
# ---------------------------------------------------------------------------
# id = <handling> | <why this handling>
#
# The handling is stated, not inferred from the id. "May this be shaded?" is
# the question §16 turns on, and inferring it from a licence name means a new
# licence silently gets whatever the string matching decides.
#
#   shadeable        may go inside a fat jar
#   unbundled        must ship as its own jar in lib/, replaceable by the
#                    operator -- which is what satisfies the relink
#                    requirement in practice. The generator FAILS if such an
#                    artifact is not in [never-bundled].
#   not-distributed  compileOnly; never leaves this project
Apache-2.0 = shadeable | Permissive.
MIT = shadeable | Permissive.
BSD-3-Clause = shadeable | Permissive.
BSD-2-Clause = shadeable | Permissive.
Public-Domain = shadeable | No obligations.
GPL-2.0-with-classpath-exception = shadeable | The classpath exception means linking imposes no obligation.
CDDL-1.0 = unbundled | Weak copyleft at file level; unmodified binary use only.
EPL-1.0 = unbundled | Weak copyleft at file level; shipped unmodified.
EPL-2.0 = unbundled | Weak copyleft at file level; shipped unmodified. Where it is dual with Apache-2.0 this project elects Apache-2.0 -- see [dual].
LGPL-2.1 = unbundled | Never shaded. Ships unmodified beside the fat jar.
LGPL-3.0 = not-distributed | compileOnly only; the host application supplies it at runtime.

# ---------------------------------------------------------------------------
[aliases]
# ---------------------------------------------------------------------------
# Raw POM <license><name> strings, mapped to the ids above. Left side is
# verbatim from the POM, including capitalisation and punctuation.
Apache-2.0 = Apache-2.0
Apache 2 = Apache-2.0
Apache 2.0 = Apache-2.0
Apache License 2.0 = Apache-2.0
Apache License, Version 2.0 = Apache-2.0
Apache License, version 2.0 = Apache-2.0
The Apache License, Version 2.0 = Apache-2.0
The Apache Software License, Version 2.0 = Apache-2.0
Apache Software License - Version 2.0 = Apache-2.0
Apache Software Licenses = Apache-2.0
MIT = MIT
MIT License = MIT
The MIT License = MIT
The MIT License (MIT) = MIT
MIT-0 = MIT
BSD-3-Clause = BSD-3-Clause
The BSD 3-Clause License = BSD-3-Clause
BSD 3-Clause = BSD-3-Clause
New BSD License = BSD-3-Clause
The New BSD License = BSD-3-Clause
BSD-2-Clause = BSD-2-Clause
The BSD License = BSD-2-Clause
Eclipse Public License - v 1.0 = EPL-1.0
Eclipse Public License 1.0 = EPL-1.0
Eclipse Public License - v 2.0 = EPL-2.0
Eclipse Public License v2.0 = EPL-2.0
Eclipse Public License - Version 2.0 = EPL-2.0
GNU Lesser General Public License = LGPL-2.1
GNU Lesser General Public License, Version 2.1 = LGPL-2.1
GNU Lesser General Public License 2.1 = LGPL-2.1
LGPL-2.1-or-later = LGPL-2.1
LGPL, version 2.1 = LGPL-2.1
GNU Lesser General Public License v3.0 = LGPL-3.0
GPL2 w/ CPE = GPL-2.0-with-classpath-exception
Public Domain = Public-Domain
Public Domain, per Creative Commons CC0 = Public-Domain
COMMON DEVELOPMENT AND DISTRIBUTION LICENSE (CDDL) Version 1.0 = CDDL-1.0

# ---------------------------------------------------------------------------
[overrides]
# ---------------------------------------------------------------------------
# Artifacts whose POM chain names no licence at all. Nothing is guessed: each
# line records where the licence was actually established.

# ---------------------------------------------------------------------------
[dual]
# ---------------------------------------------------------------------------
# Which licence this project takes a dual-licensed artifact under.
#
# This section exists because the first version of the generator took whichever
# licence the POM listed first -- which elected EPL-2.0 for Jetty when §16 says
# Apache-2.0. A decision about this project's own obligations was being made by
# the ordering of somebody else's XML. An unrecorded dual now fails the build.
#
# `group:*` elects for every artifact in a group.

# §16, verbatim: "Jetty | EPL-2.0 / Apache-2.0 dual | Taken under Apache-2.0".
org.eclipse.jetty:* = Apache-2.0
org.eclipse.jetty.websocket:* = Apache-2.0

# JNA has been dual LGPL-2.1-or-later / Apache-2.0 since 4.0, and it arrives
# here as a transitive of Jetty's Windows authentication support rather than by
# our choice. Apache-2.0, for the same reason Jetty is: this is an Apache-2.0
# project and the permissive option is available. Electing LGPL would put an
# artifact nobody chose into lib/ and onto the operator's relink obligation.
net.java.dev.jna:* = Apache-2.0

# logback is EPL-1.0 / LGPL-2.1 dual. EPL-1.0 elected, and it stays unbundled
# either way -- §16 accepts it as an "unmodified, unbundled binary dependency"
# and does not depend on which of the two is taken.
ch.qos.logback:* = EPL-1.0

# ---------------------------------------------------------------------------
[never-bundled]
# ---------------------------------------------------------------------------
# §16: no copyleft artifact inside any shaded or fat artifact. These ride in
# lib/ next to it, on the classpath via the systemd unit, so an operator can
# replace them.
#
# This list is CHECKED against the resolved graph, not trusted: any artifact
# whose elected licence is handled as `unbundled` and is missing from here
# fails the build. A copyleft dependency arriving as somebody else's transitive
# therefore cannot be bundled by nobody having noticed it.
org.mariadb.jdbc:mariadb-java-client
ch.qos.logback:logback-classic
ch.qos.logback:logback-core

# JDA's collections library, LGPL-2.1 and not dual. Unlike JNA it cannot simply
# be excluded -- JDA uses it for its entity cache -- so it ships as its own jar
# in lib/ beside the connector, replaceable by the operator.
net.sf.trove4j:core
