schema = 1
project = "soulbind"

# One guest for now. A second (a BSD, host-exec) becomes interesting only if
# soulbind is ever claimed to run there, and claiming it without a battery
# behind the claim is worse than not claiming it.
guests = ["ubuntu-26.04"]

# The toolchain arrives as a pinned image and the guest template stays generic.
# The registered ubuntu-26.04 template deliberately ships no language
# toolchains, which is why this is `container` rather than `host`.
exec = "container"

[build]
# eclipse-temurin 25-jdk, resolved 2026-08-15. A DIGEST, never a tag: a tag is a
# mutable pointer, and a build that silently changes compiler underneath itself
# is a build whose green result means nothing.
#
# Re-pinning is a deliberate act with a dated note here, not a side effect of
# somebody rebuilding on a Tuesday.
image = "docker.io/library/eclipse-temurin@sha256:c42fecf62f32725c65cfea284c012526d6fb31cc78123c740ebdc1cfd2dced12"

# `build` then `test` separately, so a compilation failure and a test failure
# are distinguishable in the log rather than collapsing into one exit code.
#
# `--rerun-tasks` on the TEST half, and only that half.
#
# The guest work tree persists between sessions, so an unchanged module's test
# task is legitimately UP-TO-DATE.
#
# An earlier version of this comment credited `cache = ["gradle"]` with keeping
# the cache warm. It did not: the cache was declared and nothing ever referenced
# $REAPER_CACHE_GRADLE, so /tank/cache/gradle sat empty while Gradle wrote to
# the guest's root disk. The narrowing below was still safe -- it only ever runs
# MORE -- but a narrowing justified by a false premise is one nobody can
# re-evaluate. harness/fullstack/stack.sh and the run stage below now use it.
#
# UP-TO-DATE is fine for a compile and wrong for this stage: the entire
# reason these tests run again in a session is that a real MariaDB is reachable
# here and is not on the workstation. A cached "success" from a run where
# MariaDB was absent is exactly the claim this stage exists to make and cannot
# make from cache. Observed: `:connector-plan:test` reported UP-TO-DATE on the
# guest across two full batteries, so the new tests never executed there.
#
# The narrowing is the test half alone. The compile half keeps its incremental
# behaviour, because a cached compile of unchanged sources is the same compile.
# GRADLE_USER_HOME points at the declared cache, which is the whole reason
# `cache = ["gradle"]` is below. Without it this stage re-downloaded the entire
# Gradle distribution into a container-local /root/.gradle that dies with
# `--rm`, every session -- while /tank/cache/gradle sat empty. reaper exports
# REAPER_CACHE_GRADLE to container jobs as well as host ones.
cmd = "GRADLE_USER_HOME=${REAPER_CACHE_GRADLE:-$HOME/.gradle} ./gradlew --no-daemon build -x test && GRADLE_USER_HOME=${REAPER_CACHE_GRADLE:-$HOME/.gradle} ./gradlew --no-daemon test --rerun-tasks"

cache = ["gradle"]

[run]
# ---------------------------------------------------------------------------
# The second storage backend.
#
# Phase 1's gate asks for the fuzz tier clean on BOTH backends. No MariaDB
# server is reachable from the workstation -- only a client is installed -- so
# the second half cannot be proven there, and claiming it would be a lie no test
# report would contradict, because a skipped backend leaves no failure behind.
#
# This is EARLIER than the plan schedules the run stage (§14 Phase 8 populates
# it with the full battery). Deliberate, and much narrower: one image, two
# tiers, no Flarum, no Paper, no Velocity. Recorded as departure 5.
#
# `exec = "host"` for this verb alone, which is what the manifest schema
# describes it for: the build needs a pinned toolchain image, and the run needs
# the guest's own container engine -- and a toolchain image has no engine client
# inside it. The first attempt ran the engine client from inside the toolchain
# container and failed with `podman: not found`, which is that sentence
# restated as an exit code.
#
# So: the engine starts MariaDB on the guest, then runs the SAME pinned
# toolchain image against it over the host network. The toolchain digest is
# repeated here rather than inherited, because `run.image` defaults to
# `build.image` only under container execution and this verb is host execution.
# ---------------------------------------------------------------------------
exec = "host"

cmd = """
set -o pipefail
set -e

# The results directory is cleared at the START of the run, on the guest.
#
# reaper copies back whatever is in out/ and never deletes, so without this a
# stage that does not run this session is reported with the result it produced
# in a previous one -- a full green both-backends result set was observed
# sitting in a freshly-emptied local out/ an hour before the tier that writes it
# had started. run.sh clears its own subdirectory, but only once it runs; this
# covers the run that never gets that far.
rm -rf out
mkdir -p out

MARIADB=docker.io/library/mariadb@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
TOOLCHAIN=docker.io/library/eclipse-temurin@sha256:c42fecf62f32725c65cfea284c012526d6fb31cc78123c740ebdc1cfd2dced12

# ---------------------------------------------------------------------------
# The cross-language vectors, FIRST.
#
# They need no database and no toolchain, so they fail in seconds rather than
# after MariaDB has come up. More to the point, they are the only check in this
# manifest that runs the OTHER implementation: the Gradle suites prove the Java
# side agrees with the corpus, and agreeing with the corpus alone is something
# both sides could do while disagreeing with each other.
#
# The runner is deliberately PHPUnit-free. PHPUnit needs ext-xmlwriter, which
# the workstation's PHP does not have, and an oracle that only runs where a
# particular extension is installed is an oracle that stops being run. The
# PHPUnit suite covers the same VectorChecks through a second entry point, and
# the runner asserts that both entry points invoke every one of them.
#
# Ordinary and hostile: the hostile pass sets a non-UTF-8 internal encoding and
# refuses to pass unless it actually took effect. A hostile run that quietly
# stayed UTF-8 proves nothing the ordinary run did not.
# ---------------------------------------------------------------------------
PHP=docker.io/library/php@sha256:f78661b492226388a7057679cc731c3e43bc92ba66cd49a8cfe12374a56bee9f

echo "run: cross-language vectors and PHP unit checks"
podman run --rm -v "$PWD":/work -w /work "$PHP" \
  php connector-flarum/tests/run-checks.php
podman run --rm -v "$PWD":/work -w /work "$PHP" \
  php connector-flarum/tests/run-checks.php --hostile

# ---------------------------------------------------------------------------
# The PHPUnit entry point, in the container that can run it.
#
# PHPUnit 11 needs ext-xmlwriter, which the workstation's PHP does not have and
# which cannot be installed without touching the system PHP -- outside the
# directive that everything created stays inside this repository. The official
# php image ships it.
#
# So nothing on the workstation is weakened and no platform requirement is
# ignored. The dependency-free runner above proves the checks pass; this proves
# the SECOND entry point runs them too, which is the claim run-checks.php makes
# about itself and which otherwise nothing verifies.
#
# Composer comes from its own pinned image rather than by fetching an installer
# script at run time. Downloading and executing a bootstrap over the network,
# unverified, inside a build is exactly the supply-chain shortcut a pinned
# digest exists to avoid -- and it would sit inside the step that is meant to
# raise confidence.
#
# ext-xmlwriter is asserted rather than assumed: if a future image drops it,
# this must fail loudly rather than quietly skipping the suite and leaving the
# green above looking like full coverage.
# ---------------------------------------------------------------------------
COMPOSER=docker.io/library/composer@sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040

echo "run: PHPUnit entry point"
# Installed from the COMMITTED lock, and the lock is validated first.
#
# Everything else this repository depends on is pinned -- image digests, jar
# checksums -- for the reason stated at the top of this file: a build that
# silently changes underneath itself is a build whose green means nothing. A
# PHP dependency tree resolved fresh on every run is the same hole, and the
# first run reported it plainly: "No composer.lock file present."
#
# `validate --check-lock` first, because `install` only WARNS when the lock has
# drifted from composer.json and then installs the old tree anyway -- a warning
# in the middle of a long log is a warning nobody reads, and the run would be
# testing dependencies that no longer match what the extension declares.
podman run --rm -v "$PWD":/work -w /work/connector-flarum \
  -e COMPOSER_HOME=/tmp/composer \
  "$COMPOSER" composer validate --no-check-publish --no-check-all --check-lock
podman run --rm -v "$PWD":/work -w /work/connector-flarum \
  -e COMPOSER_HOME=/tmp/composer \
  "$COMPOSER" composer install --no-interaction --no-progress --no-plugins

podman run --rm -v "$PWD":/work -w /work/connector-flarum "$PHP" sh -c '
  set -e
  php -m | grep -qx xmlwriter || {
    echo "the php image no longer ships ext-xmlwriter; PHPUnit cannot run" >&2
    exit 1
  }
  vendor/bin/phpunit --configuration phpunit.xml
  vendor/bin/phpunit --configuration phpunit-hostile.xml
'

# ---------------------------------------------------------------------------
# PHP mutation coverage (Infection).
#
# The same question the Java modules' `mutationTest` task asks: does a test FAIL
# when the thing it covers is broken? Sixty-one PHPUnit tests pass today, and
# nothing has ever established that any of them would notice if src/ were wrong.
#
# Runs from a pinned PHAR in an image built from the pinned PHP base with a
# coverage driver added, because Infection cannot resolve into this package's
# dependency tree -- Flarum 1.8 locks psr/log to 1.x, Infection needs ^2 || ^3.
# harness/php/pins.env carries the reasoning and the checksum.
#
# NOT gated on a minimum MSI. A threshold is a decision about what stops being
# noticed, and it goes in when there is a number worth defending. Today the
# report is read by a person.
# ---------------------------------------------------------------------------
echo "run: PHP mutation coverage"
sh harness/php/fetch.sh harness/php/.build
. ./harness/php/pins.env
podman build --quiet \
  --build-arg "BASE=$PHP" \
  --build-arg "PCOV_VERSION=$PCOV_VERSION" \
  --build-arg "INFECTION_SHA256=$INFECTION_SHA256" \
  -f harness/php/Containerfile -t soulbind-php-mutation harness/php/.build >/dev/null

podman run --rm -v "$PWD":/work -w /work/connector-flarum soulbind-php-mutation sh -c '
  set -e
  php -m | grep -qix pcov || {
    echo "no coverage driver; Infection cannot determine which tests cover a line" >&2
    exit 1
  }
  php /opt/infection.phar \
    --configuration=infection.json5 \
    --threads=max \
    --no-progress \
    --no-interaction \
    --show-mutations
'
# Into out/, which is what reaper copies back. Without this the report exists
# only inside the guest and dies with it -- and a mutation report nobody can
# read after the session is a mutation report that was not produced.
mkdir -p out/infection
cp -r connector-flarum/build/infection/. out/infection/

# ---------------------------------------------------------------------------
# The forum tier.
#
# EARLIER than the plan schedules it: §14 puts the forum image in Phase 8 with
# the rest of the full-stack battery. Phase 7's own gate asks for a forum
# account linking against a real core, and none of MariaDB, PHP or a web server
# runs on the workstation -- so the choice is to bring the stage forward or to
# claim a gate no test report could contradict, because a tier that never ran
# leaves no failure behind. Recorded as departure 6.
#
# The scope is narrow and stays narrow: a forum, a database and a browser. The
# game-side images -- Paper, Velocity -- remain Phase 8 as written.
# ---------------------------------------------------------------------------
# The shell tier's own mutation battery.
#
# HERE rather than in `build`, and the placement is the point. The guard that
# checks plan-check.sh's readers -- PlanCheckWalkerGuardTest -- needs python3,
# and the digest-pinned Temurin image the build verb runs inside has none, so
# every probe there exits 127 and the guard skips. This verb runs on the guest
# HOST, which does have one.
#
# It is also the stronger check: thirteen mutants of a real recorded Plan
# response, each required to turn the stage red, plus a control that must pass
# -- against the guard's single read. So the property is not merely restored
# here, it is asserted harder than the thing that skipped.
#
# Cheap and early. No database, no proxy, no forum, so a broken check surfaces
# in seconds instead of after the tier it guards has spent twenty minutes.
# ---------------------------------------------------------------------------
# The Java mutation ratchet.
#
# Until now the Java tiers ran ONLY when somebody remembered to ask -- PHP and
# shell mutation were in this manifest and PIT was not -- which is how
# connector-discord reached 48% without anybody deciding that it should.
#
# Here rather than in `check` for the reason build-logic states: a mutation run
# costs minutes per module where the test task costs seconds, and a slow `check`
# is a `check` people stop running. This manifest is where slow things belong.
#
# It compares against mutation-baseline.txt and fails only on a REGRESSION, so
# nobody has a threshold to negotiate. Raising a row is an edit in the same
# commit as the change that needed it.
#
# NO MARIADB IN SCOPE, deliberately and statedly: the baseline was recorded with
# no server, so core's backend-specific paths count as uncovered there too.
# Running this against a server would produce better numbers that the committed
# baseline cannot be compared with, and a ratchet comparing unlike things fires
# for the wrong reason. Closing that gap is its own task, not a side effect of
# this one.
# IN THE PINNED CONTAINER, like every other Java stage here. The guest ships no
# language toolchains -- that is why `[build] exec = "container"` exists -- and
# the first version of this stage ran `./gradlew` on the host and died with
# "JAVA_HOME is not set". DECISIONS 10.42.
#
# `-PmutationEnv=session` selects this environment's rows. They are not the
# workstation's: a session has a MariaDB server, so core's backend-specific
# paths are covered here and uncovered there. Comparing the two would fail the
# battery for a reason that has nothing to do with the change under test.
#
# `--continue` because a report of everything that regressed is worth more than
# the first regression alphabetically, and because without it a run that has
# rows to establish reports ONE module per session -- and a guard that takes
# nine fifty-minute runs to configure is a guard nobody finishes configuring.
echo "run: Java mutation ratchet"
podman run --rm --network host -v "$PWD":/work -w /work \
  -e GRADLE_USER_HOME=/work/.gradle-run-home \
  docker.io/library/eclipse-temurin@sha256:c42fecf62f32725c65cfea284c012526d6fb31cc78123c740ebdc1cfd2dced12 \
  ./gradlew --no-daemon --project-cache-dir /tmp/gradle-run-cache --continue \
    -PmutationEnv=session mutationRatchet

echo "run: shell mutation battery"
sh harness/fullstack/mutation/run.sh

# The same discipline for the group check, and it earns its place here by having
# a CONTROL: a real LuckPerms user file, taken from a run, that must read as
# holding the group. The `groups` stage previously matched a pattern LuckPerms
# never writes, so it could not pass -- and it spent a whole session red while
# the connector worked and the group sat in the file it was reading. A control
# catches that in a second.
echo "run: group-check control and mutants"
sh harness/fullstack/mutation/group-selftest.sh

# ---------------------------------------------------------------------------
# The operator tools, against a real core on SQLite.
#
# Both of these were written as workstation one-offs and neither was wired into
# anything, which meant they could rot silently between the sessions that
# happened to run them by hand. They are here because they are cheap -- one
# core, no database server, no browser, well under a minute together -- and
# because what they cover is exactly what a workstation build cannot: a shipped
# script speaking the real wire format to a real core.
#
# credential-smoke checks that every principal the harnesses register still
# holds the capabilities its operations need. It exists because moving
# `identity.describe` between capabilities broke four callers and they were
# found one thirty-minute battery at a time.
#
# audit-export runs its own control and three mutants of a core that lies about
# its paging, so the export tool's completeness checks are asserted rather than
# assumed.
# ---------------------------------------------------------------------------
echo "run: operator tools"
sh harness/credential-smoke.sh
sh harness/tools/audit-export-smoke.sh

# ---------------------------------------------------------------------------
# The Phase 10 gate: a clean install following only docs/install.md.
#
# HERE, on the guest host, because the guest host IS the gate's machine: a
# fresh Ubuntu VM with systemd, root, and no soulbind on it. The workstation
# can never run this (FreeBSD; no systemd, no useradd), so this stage is the
# first and only place the shipped unit file, the packaged samples and the
# document's own command sequence execute together.
#
# It ends with a real cross-platform link read back from core, an audit
# export that records everything the gate itself did, and a restart the link
# has to survive. Evidence lands in out/install-gate/ and syncs back.
#
# Before the container tiers rather than after: it installs from the tarball
# the build verb already produced, takes about a minute, and a hardened unit
# that will not boot should be known before twenty minutes of battery.
# ---------------------------------------------------------------------------
echo "run: clean-install gate (docs/install.md, followed literally)"
sh harness/install-gate.sh out/install-gate

# ---------------------------------------------------------------------------
# BOTH engines, because the gate asks for the T5 suite green cross-engine.
#
# The connector cannot tell which backend core uses -- that is what the storage
# seam is for -- but "cannot tell" is a claim, and running the browser tier
# against each is what tests it rather than asserting it.
for engine in sqlite mariadb; do
    echo "run: forum tier (core on $engine)"
    CORE_BACKEND=$engine sh harness/flarum/stack.sh
done

# A run must not inherit a container the previous run left behind: it would be
# serving the previous run's schema, and a green result would be about data
# nobody in this session created.
podman rm -f soulbind-mariadb >/dev/null 2>&1 || true

# Started LATIN1, on purpose, per specification §11 Tier 6.
#
# Not to test MariaDB. The point is that core must SAY what charset it wants
# rather than take the server's, because a long-lived installation upgraded
# across major versions very often still has latin1 as its server default and
# nobody involved knows it. Started utf8mb4 -- the image's default -- every
# table in the schema inherits the right answer for the wrong reason, and the
# charset assertions in this repository pass without exercising anything.
#
# This is the hostile axis for the DATABASE. The JVM's own hostile axis is
# `charsetHostilityTest`, and they are independent: a run under
# -Dfile.encoding=ISO-8859-1 against a utf8mb4 server proves nothing about a
# utf8mb4 JVM against a latin1 server.
podman run -d --name soulbind-mariadb --network host \
  -e MARIADB_ROOT_PASSWORD=soulbind-test \
  -e MARIADB_DATABASE=soulbind \
  "$MARIADB" \
  --character-set-server=latin1 --collation-server=latin1_swedish_ci

# mariadbd accepts TCP before it is ready to serve, so starting the tests on
# container-start produces a flaky failure that reads as a soulbind defect.
# Failing loudly beats proceeding against a database that never came up -- a run
# against a dead server is not a skip, it is a false negative.
ready=0
for i in $(seq 1 90); do
  if podman exec soulbind-mariadb mariadb-admin ping -h 127.0.0.1 -uroot -psoulbind-test --silent >/dev/null 2>&1; then
    echo "mariadb ready after ${i}s"
    ready=1
    break
  fi
  sleep 1
done
if [ "$ready" -ne 1 ]; then
  echo "mariadb did not become ready in 90s -- refusing to run tests against a dead database" >&2
  podman logs soulbind-mariadb >&2 || true
  exit 1
fi

# The hostile axis is only hostile if the server actually did what it was told.
#
# Passing --character-set-server=latin1 is a REQUEST. Nothing until now checked
# the answer, so a flag silently dropped -- a typo, an image whose entrypoint
# reorders arguments, a future MariaDB that refuses latin1 -- would leave every
# charset assertion in this repository passing against a utf8mb4 server, proving
# exactly nothing. The whole point of 8.18 is that a green charset test on a
# friendly server is the defect.
#
# The PHP side already does this: its vector runner prints "hostility took
# effect" and a test asserts it. This is the database's equivalent, and its
# absence was a finding in the run that first went green.
actual=$(podman exec soulbind-mariadb mariadb -h 127.0.0.1 -uroot -psoulbind-test \
  --batch --skip-column-names -e "SELECT @@GLOBAL.character_set_server" 2>/dev/null | tr -d '\r')
if [ "$actual" != "latin1" ]; then
  echo "the database axis is NOT hostile: character_set_server is '$actual', expected latin1." >&2
  echo "Every charset assertion would pass against this server without exercising anything." >&2
  exit 1
fi
echo "mariadb hostility took effect: character_set_server=$actual"

# Both tiers, both backends. StorageBackends.available() now yields two, so
# every parameterised storage and fuzz test runs twice instead of once.
# $PWD, not a hardcoded path: /reaper/work is where the tree appears INSIDE
# the toolchain container under container execution, and this verb runs on the
# host, where that path does not exist. The first attempt hardcoded it and
# podman failed with `statfs /reaper/work: no such file or directory`.
echo "run: mounting $PWD"
podman run --rm --network host \
  -v "$PWD":/work -w /work \
  -e SOULBIND_TEST_MARIADB_URL="jdbc:mariadb://127.0.0.1:3306/soulbind" \
  -e SOULBIND_TEST_MARIADB_USER=root \
  -e SOULBIND_TEST_MARIADB_PASSWORD=soulbind-test \
  -e SOULBIND_REQUIRE_MARIADB=1 \
  -e GRADLE_USER_HOME=/work/.gradle-run-home \
  "$TOOLCHAIN" \
  ./gradlew --no-daemon --project-cache-dir /tmp/gradle-run-cache :core:test :core:fuzzTest

# The results, copied OUT.
#
# `build/` is excluded from reaper's backward sync -- deliberately, it is
# megabytes of class files -- so until now nothing about WHICH tests ran on the
# guest ever left it. Gradle prints only SKIPPED and FAILED, so a green run said
# "45 tasks executed" and could not say whether the MariaDB half of a
# parameterised storage test had executed or quietly yielded one backend.
#
# That is the difference between "did not fail" and "ran and passed", and this
# repository has been wrong about that distinction repeatedly. The XML is small,
# it names every test and every parameter, and out/ is what comes home.
#
# This tier is the one that matters for it: :core:test here runs with
# SOULBIND_TEST_MARIADB_URL set, so it is the only place the second backend is
# ever exercised.
mkdir -p out/test-results
cp -r core/build/test-results/. out/test-results/ 2>/dev/null || {
  echo "no test results to copy back -- :core:test produced none, which it must" >&2
  exit 1
}
#
# The project cache dir is EPHEMERAL, and that is load-bearing rather than
# incidental.
#
# `:core:test` is the only Test task without `outputs.upToDateWhen { false }`,
# and it is the one carrying this stage's two-backend claim. It re-executes here
# only because /tmp/gradle-run-cache lives inside a `--rm` container and is gone
# every run. Point it at a persistent path and a cached SQLite-only result
# becomes the evidence for "both backends ran", silently.
#
# Written down because nothing enforces it. The enforcement that DOES exist is
# SOULBIND_REQUIRE_MARIADB above: that catches a missing server, not a cached
# result.

# ---------------------------------------------------------------------------
# The full-stack tier (specification §12).
#
# Runs on the GUEST HOST, not in a container: core, Paper and Velocity are host
# processes driven by harness/fullstack/run.sh, on the JDK and Node that
# harness/fullstack/pins.env pins by checksum and fetch.sh downloads. The guest
# ships no language toolchains, and for a while that looked like a reason to
# containerise this whole tier -- it was not. fetch.sh already ran in both
# places by design.
#
# Both axes, because the gate asks for the battery green on both backends in one
# session. MariaDB gets its OWN database here rather than sharing `soulbind`
# with the unit suite above: the fullstack tier migrates, links and audits into
# it, and a storage test asserting on rows it did not create is a storage test
# that fails for reasons nobody can find.
#
# Ordered after the unit suite deliberately. This tier is the slowest thing in
# the manifest -- a Paper world has to generate -- and a failure in the cheap
# checks should not have to wait for it.
# ---------------------------------------------------------------------------
echo "run: full-stack tier (core on sqlite)"
SOULBIND_DB=sqlite sh harness/fullstack/run.sh up migrate journeys sim groups t10 fuzz down

podman exec -i soulbind-mariadb \
  mariadb -h 127.0.0.1 -uroot -psoulbind-test <<'SQL'
-- No CHARACTER SET clause, deliberately: this database inherits the server's
-- latin1 default, which is precisely the condition core has to survive. Naming
-- utf8mb4 here would fix the schema on core's behalf and the fix would never be
-- tested. Core's own dialect migration is what makes it utf8mb4.
CREATE DATABASE IF NOT EXISTS soulbind_fullstack;
-- Plan's own database, separate from soulbind's for the same reason
-- soulbind_fullstack is separate from soulbind: a tier asserting on rows it did
-- not create is a tier that fails for reasons nobody can find. Plan writes a
-- great deal.
--
-- utf8mb4 IS named here, and the asymmetry is the point: Plan is a third party
-- and is not under test. Handing it a latin1 database would be testing Plan's
-- schema handling, not soulbind's, and a failure there would say nothing about
-- this repository while looking exactly like a defect in it.
CREATE DATABASE IF NOT EXISTS plan CHARACTER SET utf8mb4;
SQL

# Plan runs on THIS axis only, because Plan on a proxy supports MySQL and the
# sqlite axis has no server for it. Passing the coordinates is what switches it
# on; the sqlite invocation above passes none and stack.sh installs no Plan.
echo "run: full-stack tier (core on mariadb, with Plan)"
SOULBIND_DB=mariadb \
  SOULBIND_MARIADB_URL="jdbc:mariadb://127.0.0.1:3306/soulbind_fullstack" \
  SOULBIND_MARIADB_USER=root \
  SOULBIND_MARIADB_PASSWORD=soulbind-test \
  SOULBIND_PLAN_DB_HOST=127.0.0.1 \
  SOULBIND_PLAN_DB_PORT=3306 \
  SOULBIND_PLAN_DB_USER=root \
  SOULBIND_PLAN_DB_PASSWORD=soulbind-test \
  SOULBIND_PLAN_DB_NAME=plan \
  sh harness/fullstack/run.sh up migrate journeys sim plan groups t10 fuzz down

podman rm -f soulbind-mariadb >/dev/null 2>&1 || true
"""

# mariadb 11.4 LTS, resolved 2026-08-15. A DIGEST, never a tag, for the same
# reason as the build image: a tag is a mutable pointer, and a run whose
# database silently changes underneath it is a run whose green means nothing.
images = [
    "docker.io/library/mariadb@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe",
    # php 8.4-cli, resolved 2026-08-16. Digest for the same reason as the others.
    # Needs only mbstring, hash and json, all of which the official image ships;
    # notably NOT ext-xmlwriter, because the vector runner does not use PHPUnit.
    "docker.io/library/php@sha256:f78661b492226388a7057679cc731c3e43bc92ba66cd49a8cfe12374a56bee9f",
    # composer 2.10, resolved 2026-08-16. Its own image rather than an installer
    # script fetched at run time: downloading and executing an unverified
    # bootstrap inside the step meant to raise confidence is the shortcut a
    # pinned digest exists to avoid.
    "docker.io/library/composer@sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040",
    # The forum tier. Digests live in harness/flarum/pins.env, which explains why
    # the forum runs PHP 8.3 while the unit suite runs 8.4; they are repeated here
    # because this list is what the manifest validator reads.
    "docker.io/library/php@sha256:f62df9916bc05ae3c5120b41a115938f22623b0c98c815cbe2c67bc73cec21ef",
    "mcr.microsoft.com/playwright@sha256:e46352b075b3c97e226ad9ed27d6999dbc6e7f021ba94b30d833136fcee349f1",
]

[sync]
# Patterns are UNANCHORED where they need to match at any depth.
#
# These were originally written anchored -- "/build/", "/.gradle/" -- which
# matches only the repository root. Every module's build output was therefore
# being copied into the session: megabytes of class files, and worse, a moving
# target. A sync racing a local Gradle build failed with
# `file has vanished: core/build/tmp/compileJava/.../Main.class.uniqueId1`,
# because rsync was reading a directory Gradle was rewriting underneath it.
#
# "build/" without a leading slash matches a directory of that name anywhere,
# which is what was meant. "/out/" stays anchored on purpose: it is where
# results come back OUT of the guest, so syncing it in would be backwards, and
# only the root one is that.
exclude = [
    "build/",
    ".gradle/",
    "node_modules/",
    "vendor/",
    "/out/",
    # The full-stack tier's live state: a generated Paper world, a SQLite
    # database, pidfiles. Gitignored, but .gitignore is not what rsync reads --
    # 182 MB of stale world from a workstation run was copied to the guest on
    # every sync, along with pidfiles naming processes that died on another
    # machine. The guest writes its own under $REAPER_STATE and never wants
    # these.
    "/harness/fullstack/run/",
    "/harness/fullstack/run-*/",
    # The fetched artefact cache. NOT synced, in either direction.
    #
    # Syncing it in ships 69 MB of jars the guest can fetch itself, and -- worse
    # -- rsync's --delete then removes the JDK and Node that fetch.sh EXTRACTED
    # there, because those directories do not exist on the workstation. Every
    # sync would silently undo the previous run's toolchain install and pay for
    # it again.
    #
    # Everything in this directory is reproducible from pins.env by checksum,
    # which is the whole point of pinning it that way.
    "/harness/fullstack/.cache/",
]

[reset]
# Only `state` is a rollback target. Nothing lives there yet -- the stack that
# earns a @pristine snapshot arrives with the battery in Phase 8 -- but the
# dataset is declared now so that the first thing to write state cannot
# accidentally write it somewhere `reset` does not reach.
datasets = ["state"]

[resources]
cores = 6
ram_gb = 12
