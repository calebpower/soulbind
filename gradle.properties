# Toolchains are DECLARED, never inherited from PATH.
#
# On this host `java` and `javac` resolve to 17 through FreeBSD's javavm
# dispatcher even though 21 and 25 are both installed. A build that inherited
# the PATH JDK would fail at --release 25 with a message about the compiler,
# not about the toolchain, which is the confusing failure this avoids.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/usr/local/openjdk25,/usr/local/openjdk21

org.gradle.parallel=true
org.gradle.caching=true
